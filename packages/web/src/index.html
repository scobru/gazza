<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbforall</title>
<style>
  :root {
    --bg: #101014; --panel: #17171d; --line: #26262f;
    --text: #e7e7ee; --dim: #8b8b9a; --accent: #d8b74a; --bad: #d2604f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.5rem; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .3rem; letter-spacing: -.02em; }
  h1 + p { color: var(--dim); margin: 0 0 2.5rem; }

  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 2.5rem 1.5rem;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: #1c1c22; }
  .drop strong { display: block; font-size: 1.05rem; margin-bottom: .2rem; }
  .drop span { color: var(--dim); font-size: .9rem; }
  input[type=file] { display: none; }

  fieldset { border: 0; padding: 0; margin: 1.5rem 0 0; display: flex; gap: 1.5rem; flex-wrap: wrap; }
  label { display: flex; flex-direction: column; gap: .35rem; font-size: .82rem; color: var(--dim); }
  select, input[type=number] {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: .5rem .6rem; font: inherit; font-size: .9rem; min-width: 11rem;
  }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem 1.4rem; margin-top: 1.5rem; }
  .panel h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 0 0 1rem; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .55rem 1.5rem; margin: 0; }
  dt { color: var(--dim); font-size: .88rem; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  dd b { color: var(--accent); font-weight: 600; }

  button {
    margin-top: 1.5rem; width: 100%; padding: .8rem; font: inherit; font-weight: 600;
    background: var(--accent); color: #17170e; border: 0; border-radius: 9px; cursor: pointer;
  }
  button:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }

  progress { width: 100%; height: 6px; margin-top: 1rem; accent-color: var(--accent); }
  .warn { color: var(--bad); font-size: .88rem; margin-top: .8rem; }
  a.part {
    display: flex; justify-content: space-between; gap: 1rem; padding: .6rem .8rem;
    background: #1d1d24; border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); text-decoration: none; margin-bottom: .5rem; font-size: .9rem;
  }
  a.part:hover { border-color: var(--accent); }
  a.part span { color: var(--dim); font-variant-numeric: tabular-nums; }
  nav { display: flex; gap: .4rem; margin-bottom: 1.75rem; }
  nav button {
    margin: 0; width: auto; flex: 0 0 auto; padding: .45rem 1rem; font-size: .9rem;
    background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 8px;
  }
  nav button[aria-selected=true] { background: var(--panel); color: var(--text); border-color: var(--accent); }
  textarea {
    width: 100%; min-height: 5.5rem; resize: vertical; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: .7rem .8rem; font: inherit; font-size: .9rem;
  }
  input[type=password] {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: .5rem .6rem; font: inherit; font-size: .9rem; min-width: 11rem;
  }
  .note { color: var(--dim); font-size: .85rem; margin: .6rem 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>dbforall</h1>
  <p>Turn a file into a video a platform will host for you, and back again.</p>

  <nav>
    <button id="tabEncode" aria-selected="true">Encode</button>
    <button id="tabDecode" aria-selected="false">Decode</button>
  </nav>

  <div id="paneEncode">

  <label class="drop" id="drop">
    <input type="file" id="file">
    <strong id="dropTitle">Choose a file</strong>
    <span id="dropHint">or drag it here</span>
  </label>

  <fieldset>
    <label>Platform
      <select id="platform">
        <option value="youtube">YouTube — 1920×1080</option>
        <option value="instagram">Instagram — 1080×1920, 90 s per post</option>
        <option value="telegram">Telegram — send as video</option>
        <option value="whatsapp">WhatsApp — send as video</option>
      </select>
    </label>
    <label>Split into parts of
      <select id="split">
        <option value="">no limit</option>
        <option value="30">30 seconds</option>
        <option value="60">60 seconds</option>
        <option value="90">90 seconds</option>
      </select>
    </label>
  </fieldset>

  <p class="warn" id="offline" hidden></p>

  <section class="panel" id="preview" hidden>
    <h2>Before you commit</h2>
    <dl>
      <dt>Video</dt><dd><b id="pDuration">—</b> <span id="pParts"></span></dd>
      <dt>Size</dt><dd id="pSize">—</dd>
      <dt>Chunks</dt><dd id="pChunks">—</dd>
    </dl>
    <p class="warn" id="pWarn" hidden></p>
  </section>

  <button id="go" disabled>Encode</button>
  <progress id="bar" hidden></progress>

  <section class="panel" id="result" hidden>
    <h2>Ready to upload</h2>
    <div id="parts"></div>
    <p class="warn" id="error" hidden></p>
  </section>
  </div>

  <div id="paneDecode" hidden>
    <label class="drop" id="dropVideos">
      <input type="file" id="videos" accept="video/*" multiple>
      <strong id="videosTitle">Choose the carrier videos</strong>
      <span id="videosHint">or drag them here &mdash; several parts at once is fine</span>
    </label>

    <p class="note">Or paste the links, one per line:</p>
    <textarea id="urls" placeholder="https://youtu.be/..."></textarea>

    <fieldset>
      <label>Platform
        <select id="platformDecode">
          <option value="youtube">YouTube</option>
          <option value="instagram">Instagram</option>
          <option value="telegram">Telegram</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
      </label>
      <label>Password
        <input type="password" id="password" placeholder="only if it was sealed" autocomplete="off">
      </label>
    </fieldset>

    <button id="goDecode">Decode</button>
    <progress id="barDecode" hidden></progress>

    <section class="panel" id="resultDecode" hidden>
      <h2>Recovered</h2>
      <div id="recovered"></div>
      <dl id="decodeStats"></dl>
      <p class="warn" id="errorDecode" hidden></p>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let chosen = null;

const humanBytes = (n) =>
  n >= 1 << 30 ? (n / (1 << 30)).toFixed(1) + ' GB'
  : n >= 1 << 20 ? (n / (1 << 20)).toFixed(1) + ' MB'
  : n >= 1024 ? (n / 1024).toFixed(1) + ' KB'
  : n + ' B';

const humanTime = (s) =>
  s >= 60 ? Math.floor(s / 60) + ' min ' + Math.round(s % 60) + ' s' : s.toFixed(1) + ' s';

function pick(file) {
  chosen = file;
  $('dropTitle').textContent = file.name;
  $('dropHint').textContent = humanBytes(file.size);
  $('result').hidden = true;
  refresh();
}

$('file').addEventListener('change', (e) => e.target.files[0] && pick(e.target.files[0]));

// Catch drags over the whole window, not just the dashed box. Missing it by a
// few pixels would otherwise let the browser navigate away and open the file,
// which reads as "the upload does nothing".
for (const type of ['dragenter', 'dragover']) {
  window.addEventListener(type, (e) => { e.preventDefault(); $('drop').classList.add('over'); });
}
window.addEventListener('dragleave', (e) => {
  if (!e.relatedTarget) $('drop').classList.remove('over');
});
window.addEventListener('drop', (e) => {
  e.preventDefault();
  $('drop').classList.remove('over');
  // Whichever pane is open decides what a dropped file means.
  if (!$('paneDecode').hidden) {
    if (e.dataTransfer.files.length) pickCarriers(e.dataTransfer.files);
  } else if (e.dataTransfer.files[0]) {
    pick(e.dataTransfer.files[0]);
  }
});
$('platform').addEventListener('change', refresh);
$('split').addEventListener('change', refresh);

async function refresh() {
  if (!chosen) return;
  const query = new URLSearchParams({
    platform: $('platform').value,
    size: chosen.size,
    name: chosen.name,
  });
  if ($('split').value) query.set('split', $('split').value);

  // Without this the page fails silently when it is opened straight off disk
  // or the server is not running: choosing a file simply does nothing.
  let e;
  try {
    const response = await fetch('/estimate?' + query);
    if (!response.ok) throw new Error(`the server answered ${response.status}`);
    e = await response.json();
  } catch (err) {
    $('offline').textContent =
      location.protocol === 'file:'
        ? 'Open this page at http://127.0.0.1:4321 rather than from disk: it needs the local server.'
        : `Cannot reach the local server (${err.message}). Start it with: npm run web:dev`;
    $('offline').hidden = false;
    $('preview').hidden = true;
    $('go').disabled = true;
    return;
  }
  $('offline').hidden = true;
  if (e.error) return;

  $('pDuration').textContent = humanTime(e.seconds);
  $('pParts').textContent = e.parts > 1 ? `across ${e.parts} videos of ${humanTime(e.partSeconds)}` : '';
  $('pSize').textContent = `about ${humanBytes(e.approximateBytes)} of mp4`;
  $('pChunks').textContent =
    `${e.dataChunks} data + ${e.parityChunks} parity, ${e.payloadSize} B each`;

  const over = e.overSizeLimit !== undefined;
  $('pWarn').hidden = !over;
  if (over) {
    $('pWarn').textContent =
      `Each video would run ${humanTime(e.partSeconds)}, past the ${e.overSizeLimit} s this platform allows. Split shorter.`;
  }

  $('preview').hidden = false;
  $('go').disabled = over;
}

// --- tabs ---------------------------------------------------------------
function showTab(which) {
  const encoding = which === 'encode';
  $('tabEncode').setAttribute('aria-selected', String(encoding));
  $('tabDecode').setAttribute('aria-selected', String(!encoding));
  $('paneEncode').hidden = !encoding;
  $('paneDecode').hidden = encoding;
}
$('tabEncode').addEventListener('click', () => showTab('encode'));
$('tabDecode').addEventListener('click', () => showTab('decode'));

// --- decoding -----------------------------------------------------------
let carriers = [];

function pickCarriers(files) {
  carriers = [...files];
  $('videosTitle').textContent =
    carriers.length === 1 ? carriers[0].name : carriers.length + ' videos';
  $('videosHint').textContent = humanBytes(carriers.reduce((n, f) => n + f.size, 0));
}

$('videos').addEventListener('change', (e) => e.target.files.length && pickCarriers(e.target.files));

/** Read a newline-delimited JSON response, handing each event to onEvent. */
async function readEvents(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) return;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) if (line) onEvent(JSON.parse(line));
  }
}

$('goDecode').addEventListener('click', async () => {
  const urls = $('urls').value.split('\n').map((u) => u.trim()).filter(Boolean);
  if (carriers.length === 0 && urls.length === 0) return;

  $('goDecode').disabled = true;
  $('barDecode').hidden = false;
  $('barDecode').removeAttribute('value');
  $('resultDecode').hidden = true;
  $('errorDecode').hidden = true;
  $('recovered').innerHTML = '';
  $('decodeStats').innerHTML = '';

  try {
    const { id } = await (await fetch('/decode/job', { method: 'POST' })).json();
    for (const file of carriers) {
      await fetch('/decode/upload?job=' + id, { method: 'POST', body: file });
    }

    const query = new URLSearchParams({ job: id, platform: $('platformDecode').value });
    if ($('password').value) query.set('password', $('password').value);
    for (const url of urls) query.append('url', url);

    const response = await fetch('/decode?' + query, { method: 'POST' });
    await readEvents(response, (event) => {
      if (event.error) {
        $('errorDecode').textContent = event.error;
        $('errorDecode').hidden = false;
        $('resultDecode').hidden = false;
      } else if (event.done) {
        const a = document.createElement('a');
        a.className = 'part';
        a.href = '/recovered/' + id + '?name=' + encodeURIComponent(event.name);
        a.download = event.name;
        a.innerHTML = '<span>' + event.name + '</span><span>' + humanBytes(event.bytes) + '</span>';
        $('recovered').appendChild(a);
        $('decodeStats').innerHTML =
          '<dt>Frames</dt><dd>' + event.framesRead + ' read, ' + event.framesRejected + ' unreadable</dd>' +
          '<dt>Parity</dt><dd>' + (event.recovered ? event.recovered + ' chunks rebuilt' : 'never needed') + '</dd>';
        $('resultDecode').hidden = false;
      } else if (event.phase === 'decode') {
        $('barDecode').max = event.total;
        $('barDecode').value = event.completed;
      }
    });
  } catch (err) {
    $('errorDecode').textContent = err.message;
    $('errorDecode').hidden = false;
    $('resultDecode').hidden = false;
  } finally {
    $('barDecode').hidden = true;
    $('goDecode').disabled = false;
  }
});

// --- encoding -----------------------------------------------------------
$('go').addEventListener('click', async () => {
  if (!chosen) return;
  $('go').disabled = true;
  $('bar').hidden = false;
  $('bar').removeAttribute('value');
  $('result').hidden = true;
  $('error').hidden = true;
  $('parts').innerHTML = '';

  const query = new URLSearchParams({ platform: $('platform').value, name: chosen.name });
  if ($('split').value) query.set('split', $('split').value);

  try {
    const response = await fetch('/encode?' + query, { method: 'POST', body: chosen });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        const event = JSON.parse(line);

        if (event.error) {
          $('error').textContent = event.error;
          $('error').hidden = false;
          $('result').hidden = false;
        } else if (event.done) {
          for (const part of event.parts) {
            const a = document.createElement('a');
            a.className = 'part';
            a.href = `/download/${event.id}/${part.index}`;
            a.download = part.name;
            a.innerHTML = `<span>${part.name}</span><span>${humanBytes(part.bytes)}</span>`;
            $('parts').appendChild(a);
          }
          $('result').hidden = false;
        } else {
          $('bar').max = event.total;
          $('bar').value = event.completed;
        }
      }
    }
  } catch (err) {
    $('error').textContent = err.message;
    $('error').hidden = false;
    $('result').hidden = false;
  } finally {
    $('bar').hidden = true;
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
